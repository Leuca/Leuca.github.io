{% assign current = page.nav | default: page.url %}
<header class="border-bottom">
            <nav class="navbar navbar-expand-md">
                <div class="container-fluid d-md-flex justify-content-between">
                    <div>
                        <a href="/"><img src="/images/lm-logo.png" class="navbar-brand p-0 m-0 text-center" width="84" height="63" alt="Luca Magrone, home"></a>
                    </div>
                    <!--Navbar mobile-->
                    <div class="mnav d-md-none">
                        <input type="checkbox" id="navbar-lm" class="mnav-check" aria-controls="navbarMenuAlt">
                        <label class="mnav-toggle" for="navbar-lm">
                            <span class="visually-hidden">Menu</span>
                            <span class="bar top" aria-hidden="true"></span>
                            <span class="bar middle" aria-hidden="true"></span>
                            <span class="bar bottom" aria-hidden="true"></span>
                        </label>
                        <div class="mnav-panel" id="navbarMenuAlt">
                            {% for item in site.data.pages %}
                            <a class="mnav-link" {% if item.url == current %}aria-current="page"{% endif %} href="{{ item.url }}">{{ item.name }}</a>
                            {% endfor %}
                        </div>
                    </div>
                    <!--Navbar widescreen-->
                    <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
                        <div class="navbar-nav">
                            {% for item in site.data.pages %}
                            <a class="nav-link {% if item.url == current %}active{% endif %}" {% if item.url == current %}aria-current="page"{% endif %} href="{{ item.url }}">{{ item.name }}</a>
                                <hr class="m-0">
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </nav>
        </header>
