<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        {{ page.links }}
        <link href="/css/styles.css" rel="stylesheet">
        <link href="/css/navlm.css" rel="stylesheet">
        {{ page.script }}

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ page.title }}{% if page.collection == "posts" %} - LM{% endif %}</title>
        {% assign desc = page.description | default: site.description %}
        <meta name="description" content="{{ desc | escape }}">
        <meta property="og:title" content="{{ page.title | escape }}">
        <meta property="og:description" content="{{ desc | escape }}">
        <meta property="og:url" content="{{ page.url | absolute_url }}">
        <meta property="og:type" content="{% if page.collection == "posts" %}article{% else %}website{% endif %}">
        {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">
        <meta name="twitter:card" content="summary_large_image">{% endif %}
        {% feed_meta %}

        <link rel="icon" type="image/x-icon" href="/favicon.ico">
    </head>
    <body class="col-lg-8 mx-auto">
        <!--Navbar-->
        {% include navbar.html %}

        <main class="container-fluid mt-3 py-5">
            {{ content }}
        </main>

        {% include footer.html %}
    </body>
</html>
